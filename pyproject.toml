[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-template-compiler"
version = "0.1.0"
description = "Compile example-shaped JSON templates into strict Draft 2020-12 JSON Schemas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.24.0",
]

[project.scripts]
schema-template-compiler = "schema_template_compiler.compiler:main"

[tool.setuptools.package-data]
schema_template_compiler = ["patterns.json"]

[tool.unittest]
start-directory = "tests"
